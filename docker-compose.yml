services:
  registre-si:
    build: .
    ports:
      - "3737:3737"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REGISTRE_MODEL: ${REGISTRE_MODEL:-}
      REGISTRE_PROVIDER: ${REGISTRE_PROVIDER:-}
      REGISTRE_BASE_URL: ${REGISTRE_BASE_URL:-}
      REGISTRE_API_KEY: ${REGISTRE_API_KEY:-}
      REGISTRE_PASSWORD: ${REGISTRE_PASSWORD:-}
      REGISTRE_COOKIE_SECURE: ${REGISTRE_COOKIE_SECURE:-false}
    volumes:
      - registre_data:/data

volumes:
  registre_data:
